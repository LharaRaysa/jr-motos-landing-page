<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JR Motos</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <h1>JR Motos</h1>
    </header>

    <main>
      <section class="hero" aria-labelledby="hero-title">
        <h2 id="hero-title">A sua mota em boas mãos na JR Motos</h2>
        <button id="scheduleButton" class="cta-button" type="button">Agendar Revisão</button>
      </section>

      <section class="services" aria-labelledby="services-title">
        <h2 id="services-title">Serviços</h2>
        <p>
          Na JR Motos, garantimos atendimento transparente, diagnóstico claro e revisão com foco em
          qualidade para manter a sua mota sempre pronta para a estrada.
        </p>
      </section>

      <section class="contact" id="contact" aria-labelledby="contact-title">
        <h2 id="contact-title">Contacto</h2>
        <form id="contactForm" novalidate>
          <label for="name">Nome</label>
          <input type="text" id="name" name="name" required />

          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required />

          <label for="cep">CEP</label>
          <input type="text" id="cep" name="cep" inputmode="numeric" maxlength="9" required />

          <label for="street">Rua</label>
          <input type="text" id="street" name="street" required />

          <label for="district">Bairro</label>
          <input type="text" id="district" name="district" required />

          <label for="message">Mensagem</label>
          <textarea id="message" name="message" rows="4" required></textarea>

          <button class="cta-button" type="submit">Enviar</button>
        </form>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
